[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travelguard-ai"
version = "0.1.0"
description = "AI layer for TravelGuard: LangGraph decisioning and XGBoost risk engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.8.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "xgboost>=2.1.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "network_as_code"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0"
]
explainability = [
  "shap>=0.46.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
